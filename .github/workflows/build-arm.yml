name: Build ARM Binary

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  create-runner:
    name: Create Hetzner ARM runner
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.create.outputs.label }}
      server_id: ${{ steps.create.outputs.server_id }}
    steps:
      - name: Create Hetzner CAX41 runner
        id: create
        uses: Cyclenerd/hcloud-github-runner@v1
        with:
          mode: create
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          server_type: cax41
          location: nbg1
          image: ubuntu-24.04

  build:
    name: Build ARMv7
    needs: create-runner
    runs-on: ${{ needs.create-runner.outputs.label }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker
        run: |
          curl -fsSL https://get.docker.com | sudo sh
          sudo usermod -aG docker $USER

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARMv7 binary with Docker
        run: |
          sudo docker build \
            --platform linux/arm/v7 \
            --memory=28g \
            --memory-swap=30g \
            -f .github/Dockerfile.arm-glibc-static \
            -t kindle-hid-passthrough-builder \
            --load \
            .

      - name: Extract binaries
        run: |
          CONTAINER_ID=$(sudo docker create kindle-hid-passthrough-builder)
          mkdir -p dist
          sudo docker cp "$CONTAINER_ID:/build/kindle-hid-passthrough" ./dist/kindle-hid-passthrough
          sudo docker cp "$CONTAINER_ID:/build/kindle-hid-passthrough.bin" ./dist/kindle-hid-passthrough.bin
          sudo docker cp "$CONTAINER_ID:/build/libsyscall_wrapper.so" ./dist/libsyscall_wrapper.so
          sudo docker rm "$CONTAINER_ID"
          chmod +x dist/kindle-hid-passthrough dist/kindle-hid-passthrough.bin

      - name: Add config files
        run: |
          cp kindle_hid_passthrough/hid-passthrough.upstart dist/
          cp kindle_hid_passthrough/config.ini dist/

      - name: Show contents
        run: |
          file dist/*
          ls -lh dist/

      - name: Create tarball
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          tar -czvf "kindle-hid-passthrough-${VERSION}-armv7.tar.gz" -C dist .
          ls -lh *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kindle-hid-passthrough-armv7
          path: |
            dist/
            *.tar.gz

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: kindle-hid-passthrough-${{ github.ref_name }}-armv7.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  delete-runner:
    name: Delete Hetzner runner
    needs: [create-runner, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Delete Hetzner runner
        uses: Cyclenerd/hcloud-github-runner@v1
        with:
          mode: delete
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          name: ${{ needs.create-runner.outputs.label }}
          server_id: ${{ needs.create-runner.outputs.server_id }}
