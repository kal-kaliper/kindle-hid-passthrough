name: Build Kindle Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Python zipapp with Docker
        run: |
          docker build \
            -f Dockerfile.zipapp \
            -t kindle-zipapp-builder \
            --load \
            .

      - name: Extract zipapp
        run: |
          CONTAINER_ID=$(docker create kindle-zipapp-builder)
          docker cp "$CONTAINER_ID:/build/kindle-hid-passthrough.pyz" ./kindle-hid-passthrough.pyz
          docker rm "$CONTAINER_ID"

      - name: Show zipapp info
        run: |
          file kindle-hid-passthrough.pyz
          ls -lh kindle-hid-passthrough.pyz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kindle-hid-passthrough
          path: kindle-hid-passthrough.pyz

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: kindle-hid-passthrough.pyz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
