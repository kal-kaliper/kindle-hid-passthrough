name: Build ARM Binary

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Use native ARM64 runner - supports AArch32 EL0 (32-bit ARM execution)
    # This is MUCH faster than x86 + QEMU emulation (minutes vs hours)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No QEMU needed! ARM64 runners with Ampere Altra/Cobalt 100 CPUs
      # support native 32-bit ARM execution via AArch32 EL0

      - name: Build ARMv7 binary with Docker
        run: |
          # Build using arm32v7 container - runs natively on ARM64
          # --platform ensures correct 32-bit ARM image is pulled
          docker build \
            --platform linux/arm/v7 \
            -f Dockerfile.arm \
            -t kindle-hid-passthrough-builder \
            .

      - name: Extract binary
        run: |
          CONTAINER_ID=$(docker create kindle-hid-passthrough-builder)
          docker cp "$CONTAINER_ID:/build/kindle-hid-passthrough" ./kindle-hid-passthrough
          docker rm "$CONTAINER_ID"

      - name: Verify binary architecture
        run: |
          file kindle-hid-passthrough
          ls -lh kindle-hid-passthrough
          # Verify it's 32-bit ARM, not 64-bit
          file kindle-hid-passthrough | grep -q "ARM" || exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kindle-hid-passthrough-armv7
          path: kindle-hid-passthrough

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: kindle-hid-passthrough
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
