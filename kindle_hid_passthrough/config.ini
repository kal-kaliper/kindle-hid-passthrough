# BLE/Classic HID Host Configuration

[paths]
cache_dir = /mnt/us/kindle_hid_passthrough/cache
devices_config = /mnt/us/kindle_hid_passthrough/devices.conf

[connection]
reconnect_delay = 5
hci_reset_timeout = 10
connect_timeout = 30
transport_timeout = 30

[transport]
# hci_transport = file:/dev/stpbt

[device]
name = Kindle-HID
address = F0:F0:F0:F0:F0:F0

[protocol]
# Default protocol: ble or classic
type = classic

[classic]
require_live_descriptor = true
# auto serializes phone HID apps, which accumulate held keys; always and never
# override it. Physical keyboards need auto to preserve their auto-repeat.
serialize_keyboard_reports = auto
serialized_report_delay_ms = 0
keyboard_modifier_mask = 0xff
defer_uhid_until_input_names =
short_idle_retry_names =
# Device names or addresses that are connect-on-demand: never actively dialed,
# idle drops are not auto-restored, but page-scan stays on so the device is
# still accepted whenever it initiates the connection itself (e.g. a phone).
passive_names =
# A HID device declares in its SDP record (HIDReconnectInitiate, 0x0205)
# whether it re-establishes the link itself. When it does, dialing it wastes
# radio time and blanks page scan during the very window it is paging us in,
# so such devices are treated as connect-on-demand automatically. Set false
# for firmware that declares true but never actually reconnects.
trust_reconnect_initiate = true
# Longest page scan may stay dark in one stretch while a Classic device is
# configured but not connected. A keyboard wakes on a keypress and pages for
# only a few seconds, so a longer hold loses the entire page burst rather
# than part of it.
page_scan_max_dark = 2.0
# How long page scan is left up between radio slices. One page scan interval
# is 1.28s, so a shorter dwell risks a page landing wholly inside a gap.
page_scan_dwell = 1.5

[ble]
kindle_text_mode = false
serialize_keyboard_reports = false
serialized_report_delay_ms = 0
keyboard_modifier_mask = 0xff
# Some keyboards bind Esc to the Consumer "AC Home" control instead of the
# Keyboard-page Escape usage. When true, that specific report is rewritten
# into a synthesized Escape keypress before forwarding to UHID.
remap_consumer_home_to_escape = false
# Whether a BLE initiate window blanks Classic page scan. On a normal
# controller page scan and LE initiate coexist; this chip shares wmt_drv with
# Wi-Fi and that has not been verified here, so the exclusivity is kept by
# default and bounded by classic.page_scan_max_dark. Set false to test
# whether it is needed at all.
pause_classic_page_scan = true

[power]
monitor_enabled = true
startup_delay = 8.0
# Fallback fixed delay used only when wifi_gate_enabled is false.
resume_delay = 20.0
resume_max_delay = 90.0
wifi_gate_enabled = true
resume_min_delay = 2.0
resume_poll_interval = 1.0
resume_stable_polls = 2

[diagnostics]
include_reports = false
recent_report_count = 12

[logging]
log_file = /var/log/hid_passthrough.log
